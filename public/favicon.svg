<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89AACC"/>
      <stop offset="50%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#4E85BF"/>
    </linearGradient>
  </defs>
  <!-- Background circle with gradient border -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0a" stroke="url(#grad)" stroke-width="3"/>
  <!-- Inner T letter in elegant serif -->
  <text x="32" y="44" font-family="'Instrument Serif', serif, Georgia" font-size="36" font-style="italic" fill="#f5f5f5" text-anchor="middle" font-weight="normal">T</text>
</svg>
